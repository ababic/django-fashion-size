[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-fashion-size"
version = "0.8.0"
description = "Django fields for fashion-size size units and stored sizes."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Andy Babic" }]
dependencies = [
    "django>=6.0,<7",
    "fashion-size>=2026.10.8.1",
]

[project.optional-dependencies]
testing = [
    "pytest>=8",
    "tox>=4",
]
development = [
    "ruff>=0.11,<1",
]

[project.urls]
Repository = "https://github.com/ababic/django-fashion-size"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/django_fashion_size"]

[tool.hatch.build.targets.sdist]
exclude = ["/frontend"]

[tool.hatch.build]
artifacts = [
    "src/django_fashion_size/static/django_fashion_size/size_value_field.css",
    "src/django_fashion_size/static/django_fashion_size/size_value_field.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "I001"]
