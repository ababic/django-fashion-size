[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-fashion-size"
version = "0.1.0"
description = "Django fields for fashion-size measurements and stored measurement values."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Andy Babic" }]
dependencies = [
    "django>=4.2",
    "fashion-size",
]

[project.urls]
Repository = "https://github.com/ababic/django-fashion-size"

[tool.uv.sources]
fashion-size = { path = "../fashion-size", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/django_fashion_size"]
