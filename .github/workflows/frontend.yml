name: Frontend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint JavaScript and CSS
        run: npm run lint

      - name: Build widget assets
        run: npm run build

      - name: Check committed static files match the build
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- src/django_fashion_size/static/django_fashion_size/
