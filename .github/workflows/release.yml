name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag push is not a branch push, so the trigger cannot filter by branch.
      # Publish only when the tagged commit is already on main or a release-* branch.
      - name: Require main or a release branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git fetch --no-tags origin '+refs/heads/release-*:refs/remotes/origin/release-*'; then
            echo "No release-* branches on origin."
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Publishing ${GITHUB_REF_NAME}: ${GITHUB_SHA} is on main."
            exit 0
          fi
          branches="$(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release-*' --contains "$GITHUB_SHA" || true)"
          if [ -n "$branches" ]; then
            echo "Publishing ${GITHUB_REF_NAME}: ${GITHUB_SHA} is on ${branches}."
            exit 0
          fi
          echo "Not publishing ${GITHUB_REF_NAME}: ${GITHUB_SHA} is not on main or a release-* branch."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          python -m pip install build
          python -m build

      - name: Attach the built distributions to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
