[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-fashion-size"
version = "0.1.0"
description = "Django fields for fashion-size size units and stored sizes."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Andy Babic" }]
dependencies = [
    "django>=4.2",
    "fashion-size",
]

[project.urls]
Repository = "https://github.com/ababic/django-fashion-size"

[tool.uv.sources]
fashion-size = { path = "../fashion-size", editable = true }

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/django_fashion_size"]

[tool.hatch.build.targets.sdist]
exclude = ["/frontend"]

[tool.hatch.build]
artifacts = [
    "src/django_fashion_size/static/django_fashion_size/size_value_field.css",
    "src/django_fashion_size/static/django_fashion_size/size_value_field.js",
]
